name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Refresh the dashboard data once a day, from 08:30 Norwegian time. GitHub starts scheduled runs late,
    # often by hours, so there are several entries (UTC) and the "gate" job lets the first one through that
    # is past 08:30 in Norway and finds no data from today on the live site. The later ones then do nothing.
    - cron: "30 6 * * *"
    - cron: "30 7 * * *"
    - cron: "30 8 * * *"
    - cron: "30 9 * * *"
    - cron: "30 10 * * *"
    - cron: "30 11 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        name: Let a scheduled run through if it is past 08:30 in Norway and the live data is not from today
        run: |
          go=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            now=$(TZ=Europe/Oslo date +%H%M); today=$(TZ=Europe/Oslo date +%F)
            if [ $((10#$now)) -lt 830 ]; then go=false; echo "before 08:30 in Norway ($now)"; fi
            # the day the live data file was generated, in Norwegian time (empty if the site does not answer, which means: refresh)
            gen=$(curl -s -m 20 https://www.martinbholm.com/data/dashboard.json | grep -o '"generated":"[^"]*"' | cut -d'"' -f4)
            last=$([ -n "$gen" ] && TZ=Europe/Oslo date -d "$gen" +%F || true)
            if [ "$last" = "$today" ]; then go=false; echo "the live data is already from today ($gen)"; fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate "Recent" lists on the home page
        run: python build_recent.py
      - name: Fetch fresh dashboard data (SSB, Norges Bank, NBIM)
        run: python build_dashboard_data.py
        timeout-minutes: 6        # a source that does not answer must not hold the deploy up
        continue-on-error: true   # a source outage must not block the deploy; the committed data/dashboard.json is the fallback
      - name: Stamp stylesheet and script links with the commit id
        # Browsers keep old copies of .css/.js files; a new ?v= on every commit makes them fetch the new ones.
        run: |
          sed -i -E "s/(href|src)=\"(style\.css|dashboard\.css|site\.js|dashboard\.js)(\?v=[^\"]*)?\"/\1=\"\2?v=${GITHUB_SHA::8}\"/g" *.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
