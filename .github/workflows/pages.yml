name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Every morning at 08:30 Norwegian time: refresh the dashboard data and redeploy.
    # GitHub's clock is UTC and ignores daylight saving time, so there is one entry for summer time
    # (06:30 UTC) and one for winter time (07:30 UTC). The "gate" job lets only the right one through.
    - cron: "30 6 * * *"
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        name: Let a scheduled run through only if it is the 08:30 one in Norway
        run: |
          go=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            offset=$(TZ=Europe/Oslo date +%z)
            if [ "${{ github.event.schedule }}" = "30 6 * * *" ] && [ "$offset" != "+0200" ]; then go=false; fi
            if [ "${{ github.event.schedule }}" = "30 7 * * *" ] && [ "$offset" = "+0200" ]; then go=false; fi   # also runs if the time zone lookup fails
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate "Recent" lists on the home page
        run: python build_recent.py
      - name: Fetch fresh dashboard data (SSB, Norges Bank, NBIM)
        run: python build_dashboard_data.py
        timeout-minutes: 6        # a source that does not answer must not hold the deploy up
        continue-on-error: true   # a source outage must not block the deploy; the committed data/dashboard.json is the fallback
      - name: Stamp stylesheet and script links with the commit id
        # Browsers keep old copies of .css/.js files; a new ?v= on every commit makes them fetch the new ones.
        run: |
          sed -i -E "s/(href|src)=\"(style\.css|dashboard\.css|site\.js|dashboard\.js)(\?v=[^\"]*)?\"/\1=\"\2?v=${GITHUB_SHA::8}\"/g" *.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
