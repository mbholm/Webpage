name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "20 6 * * *"   # every morning 06:20 UTC: refresh the dashboard data and redeploy
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate "Recent" lists on the home page
        run: python build_recent.py
      - name: Fetch fresh dashboard data (SSB, Norges Bank, NBIM)
        run: python build_dashboard_data.py
        continue-on-error: true   # a source outage must not block the deploy; the committed data/dashboard.json is the fallback
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
